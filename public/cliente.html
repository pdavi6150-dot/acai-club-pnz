<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Açaí Club PNZ • Cliente</title>
<style>
body{margin:0;font-family:Arial;background:#faf7fc;color:#261c2c}header{background:linear-gradient(135deg,#512475,#9149bd);color:white;padding:22px;text-align:center}main{max-width:1050px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:1fr 360px;gap:18px}.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.card,.box{background:white;padding:16px;border-radius:16px;box-shadow:0 3px 15px #0001}.emoji{font-size:32px}.price{font-weight:900;color:#57267b;font-size:19px;margin:8px 0}.add,button{border:0;border-radius:9px;padding:10px;font-weight:800;cursor:pointer}.add{background:#ef5b89;color:white;width:100%}input,textarea,select{width:100%;padding:10px;margin:5px 0 10px;border:1px solid #ddd;border-radius:8px;box-sizing:border-box}.row{display:grid;grid-template-columns:1fr 70px 70px 25px;gap:5px;padding:8px 0;border-bottom:1px solid #eee}.total{font-size:23px;font-weight:900;text-align:right;color:#57267b;margin:15px 0}.send{width:100%;background:#25c866;color:white;font-size:16px}.ok{display:none;background:#e1f7e8;color:#176c38;padding:12px;border-radius:9px;margin-bottom:12px}.small{font-size:12px;color:#777}@media(max-width:800px){.grid{grid-template-columns:1fr}}
</style></head><body><header><h1>💜 Açaí Club PNZ</h1><div>Faça seu pedido online</div></header><main><div id="ok" class="ok"></div><div class="grid"><section><h2>Cardápio</h2><div id="products" class="products"></div></section><aside class="box"><h2>🛒 Seu pedido</h2><div id="cart"></div><div id="total" class="total">R$ 0,00</div><h3>Seus dados</h3><input id="name" placeholder="Nome"><input id="phone" placeholder="WhatsApp"><select id="delivery"><option>Entrega</option><option>Retirada na loja</option></select><input id="address" placeholder="Endereço completo"><input id="neighborhood" placeholder="Bairro"><textarea id="obs" placeholder="Observação"></textarea><button class="send" onclick="send()">📲 Enviar pedido</button><p class="small">Após enviar, a loja receberá seu pedido no painel.</p></aside></div></main>
<script>
const P=[["Açaí 300ml","Açaí + 5 acompanhamentos",19.9,"🍇"],["Açaí 500ml","Açaí + 6 acompanhamentos",27.9,"🍓"],["Açaí 700ml","Açaí + 7 acompanhamentos",34.9,"🫐"],["Açaí 1 Litro","Para compartilhar",49.9,"💜"],["Ninho Morango 400ml","Açaí + Ninho + morango",27.9,"🍓"],["Oreo Cream 400ml","Açaí + Oreo",28.9,"🍪"],["Nutella Crocante 400ml","Açaí + creme de avelã",31.9,"🍫"],["Cone Ninho","Cone + açaí + Ninho",14.9,"🍦"],["Cone Nutella","Cone + açaí + Nutella",16.9,"🍫"],["Brigadeiro","Unidade",3.5,"🍫"],["Caixa 6 Brigadeiros","Até 3 sabores",20,"🎁"],["Coxinha de Frango","Unidade",7,"🍗"],["Coxinha com Catupiry","Unidade",8,"🍗"],["Bolinha de Queijo","Unidade",7,"🧀"],["Kibe","Unidade",7,"🥟"],["Combo 5 Salgados","Escolha os sabores",32,"🍱"],["Batata Frita M","Porção",18.9,"🍟"],["Batata Cheddar & Bacon","Porção",24.9,"🥓"],["Refrigerante Lata","350ml",6,"🥤"],["Suco Natural 500ml","Sabores do dia",9.9,"🍹"],["Combo Club 1","Açaí 300ml + 2 brigadeiros + refri",31.9,"🔥"],["Combo Casal","2 Açaís 500ml + 6 brigadeiros",68.9,"💜"]];
let cart=[];const money=x=>x.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
document.getElementById("products").innerHTML=P.map((p,i)=>`<article class="card"><div class="emoji">${p[3]}</div><b>${p[0]}</b><p class="small">${p[1]}</p><div class="price">${money(p[2])}</div><button class="add" onclick="add(${i})">Adicionar</button></article>`).join("");
function add(i){let p=P[i],x=cart.find(x=>x.name===p[0]);x?x.q++:cart.push({name:p[0],price:p[2],q:1});render()}
function ch(i,d){cart[i].q+=d;if(cart[i].q<1)cart.splice(i,1);render()}
function render(){document.getElementById("cart").innerHTML=cart.length?cart.map((x,i)=>`<div class="row"><span>${x.name}</span><span><button onclick="ch(${i},-1)">−</button>${x.q}<button onclick="ch(${i},1)">+</button></span><b>${money(x.price*x.q)}</b><button onclick="cart.splice(${i},1);render()">×</button></div>`).join(""):"<p class='small'>Carrinho vazio.</p>";document.getElementById("total").textContent=money(cart.reduce((s,x)=>s+x.price*x.q,0))}
async function send(){let name=document.getElementById("name").value.trim();if(!name||!cart.length)return alert("Informe seu nome e escolha produtos.");let o={id:Date.now(),name,phone:document.getElementById("phone").value,delivery:document.getElementById("delivery").value,address:document.getElementById("address").value,neighborhood:document.getElementById("neighborhood").value,obs:document.getElementById("obs").value,items:cart,total:cart.reduce((s,x)=>s+x.price*x.q,0),time:new Date().toLocaleString("pt-BR")};
try{let r=await fetch("/api/orders",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(o)});if(!r.ok)throw 0;cart=[];render();document.getElementById("ok").style.display="block";document.getElementById("ok").textContent="✅ Pedido enviado para a loja!";}catch(e){alert("O sistema ainda não está conectado ao servidor. Publique cliente e loja na mesma aplicação seguindo o guia.");}}
render();
</script></body></html>
