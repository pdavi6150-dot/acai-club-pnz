<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Açaí Club PNZ • Loja</title>
<style>body{margin:0;font-family:Arial;background:#f5f1f8;color:#261d2b}header{background:linear-gradient(135deg,#512475,#9149bd);color:white;padding:20px}.wrap{max-width:1100px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center}.orders{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:15px}.order{background:white;border-radius:15px;padding:16px;border-left:6px solid #f2a51b;box-shadow:0 3px 15px #0001}.preparo{border-left-color:#65429a}.pronto{border-left-color:#22a85c}.btn{border:0;border-radius:8px;padding:9px 11px;font-weight:800;cursor:pointer}.green{background:#daf5e3;color:#176d3b}.purple{background:#57267b;color:white}.gray{background:#eee}.pill{background:#f1e5f6;padding:5px 8px;border-radius:99px;font-size:11px}.new{animation:pulse 1s infinite}@keyframes pulse{50%{box-shadow:0 0 0 5px #f2a51b33}}.empty{text-align:center;background:white;padding:35px;border-radius:15px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}</style></head><body><header><div class="wrap top"><div><h1>🏪 Açaí Club PNZ</h1><div>Painel de pedidos</div></div><b id="status">🟢 Conectado</b></div></header><main class="wrap"><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px"><button class="btn purple" onclick="filter='all';load()">Todos</button><button class="btn purple" onclick="filter='novo';load()">Novos</button><button class="btn purple" onclick="filter='preparo';load()">Em preparo</button><button class="btn purple" onclick="filter='pronto';load()">Prontos</button></div><div id="orders" class="orders"></div></main>
<script>
let filter="all",last=0;const money=x=>x.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
async function load(){try{let r=await fetch("/api/orders");let all=await r.json();let a=filter==="all"?all:all.filter(o=>o.status===filter);if(all.length>last&&last>0){new Audio("data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=").play().catch(()=>{});document.title="🔔 NOVO PEDIDO • Açaí Club PNZ"}last=all.length;document.getElementById("orders").innerHTML=a.length?a.map(o=>`<article class="order ${o.status} ${o.status==="novo"?"new":""}"><div style="display:flex;justify-content:space-between"><b>#${String(o.id).slice(-5)} — ${o.name}</b><span class="pill">${o.status.toUpperCase()}</span></div><small>${o.time} • ${o.delivery}</small><div style="margin:12px 0">${o.items.map(x=>`<div>${x.q}x ${x.name} — ${money(x.price*x.q)}</div>`).join("")}</div><b>Total: ${money(o.total)}</b>${o.phone?`<div>📞 ${o.phone}</div>`:""}${o.address?`<div>📍 ${o.address} - ${o.neighborhood||""}</div>`:""}${o.obs?`<div>📝 ${o.obs}</div>`:""}<div class="actions">${o.status==="novo"?`<button class="btn green" onclick="setS(${o.id},'preparo')">👨‍🍳 Aceitar</button>`:""}${o.status==="preparo"?`<button class="btn green" onclick="setS(${o.id},'pronto')">✅ Pronto</button>`:""}${o.status==="pronto"?`<button class="btn gray" onclick="setS(${o.id},'finalizado')">🏁 Finalizar</button>`:""}<button class="btn purple" onclick="printO(${o.id})">🖨️ Imprimir</button></div></article>`).join(""):"<div class='empty'>Nenhum pedido.</div>"}catch(e){document.getElementById("status").textContent="🔴 Servidor desconectado"}}
async function setS(id,status){await fetch("/api/orders/"+id,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({status})});load()}
async function printO(id){let all=await (await fetch("/api/orders")).json(),o=all.find(x=>x.id===id),w=open("","_blank","width=450,height=700");w.document.write(`<body style="font-family:Arial;width:320px;padding:20px"><h2 style="text-align:center">AÇAÍ CLUB PNZ</h2><b>Pedido #${String(o.id).slice(-5)}</b><hr>${o.items.map(x=>`<div>${x.q}x ${x.name} — ${money(x.price*x.q)}</div>`).join("")}<hr><h2 style="text-align:right">TOTAL ${money(o.total)}</h2><b>${o.name}</b><br>${o.address||o.delivery}<script>onload=()=>print()<\/script>`);w.document.close()}
load();setInterval(load,3000);
</script></body></html>
